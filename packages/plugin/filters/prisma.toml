[filters.prisma]
description = "Compact prisma output (migrate / generate / db push)"
match_command = "^prisma(\\s|$)|^npx\\s+prisma|^pnpm\\s+(exec\\s+)?prisma|^yarn\\s+prisma"
priority = 60
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^Prisma schema loaded from",
  "^Datasource ",
  "^Already in sync",
  "^Generated Prisma Client",
  "^✔ Generated Prisma Client",
  "^Tip:",
  "^\\s*\\d+\\.?\\d*s\\s*$",
  "^\\s*✔ ",
  "^prisma:",
]
max_lines = 220
