# CLA check for pull requests to the public Tokmizer repository.
# Contributors sign CLA.md by commenting on their pull request; signatures are
# committed to signatures/version1/cla.json on the unprotected cla-signatures
# branch of this repository. The job only runs in a public repository.
# Setup: create the cla-signatures branch once (it must not be protected) and
# keep "Read and write permissions" available to workflows. No extra secret is
# needed while signatures stay in this repository.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.event.repository.private == false &&
      (github.event_name == 'pull_request_target' ||
       (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')))
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: dependabot[bot],github-actions[bot],renovate[bot]
          lock-pullrequest-aftermerge: true
